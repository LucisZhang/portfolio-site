server {
    listen 127.0.0.1:18080;
    server_name _;

    access_log /var/log/nginx/portfolio-preview.access.log;
    error_log /var/log/nginx/portfolio-preview.error.log warn;

    client_max_body_size 32k;
    server_tokens off;

    location /_vps/health {
        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_cache off;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location /api/assistant {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /duckdb/ {
        root /srv/portfolio/current/public;
        try_files $uri =404;
        gzip_static on;
        types {
            application/javascript js mjs;
            application/wasm wasm;
            application/octet-stream parquet;
        }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /generated/privacy-ocr/ {
        root /srv/portfolio/current/public;
        try_files $uri =404;
        gzip_static on;
        types {
            application/javascript js mjs;
            application/wasm wasm;
        }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /generated/privacy-pdf/ {
        root /srv/portfolio/current/public;
        try_files $uri =404;
        gzip_static on;
        types {
            application/javascript js mjs;
            application/wasm wasm;
        }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /case-studies/ {
        root /srv/portfolio/current/public;
        try_files $uri =404;
        gzip_static on;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_cache off;
    }
}
