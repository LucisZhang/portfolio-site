server {
    listen 127.0.0.1:18081;
    server_name _;

    access_log /var/log/nginx/portfolio-preview-tunnel.access.log;
    error_log /var/log/nginx/portfolio-preview-tunnel.error.log warn;

    client_max_body_size 32k;
    server_tokens off;

    # This listener is loopback-only and reserved for cloudflared. Preserve the
    # visitor address for server-side HMAC rate limiting without trusting public
    # X-Forwarded-For input. The original 18080 SSH Preview remains unchanged.
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;

    location /_vps/health {
        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_cache off;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location /api/assistant {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_cache off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Release-local public artifacts bypass Next.js. One-day browser caching is intentionally
    # bounded because these public URLs are stable rather than content-addressed; gzip_static uses
    # files produced on the local build machine so the small VPS never compresses them on demand.
    location ^~ /duckdb/ {
        root /srv/portfolio/current/public;
        try_files $uri =404;
        gzip_static on;
        types {
            application/javascript js mjs;
            application/wasm wasm;
            application/octet-stream parquet;
        }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /generated/privacy-ocr/ {
        root /srv/portfolio/current/public;
        try_files $uri =404;
        gzip_static on;
        types {
            application/javascript js mjs;
            application/wasm wasm;
        }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /generated/privacy-pdf/ {
        root /srv/portfolio/current/public;
        try_files $uri =404;
        gzip_static on;
        types {
            application/javascript js mjs;
            application/wasm wasm;
        }
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /case-studies/ {
        root /srv/portfolio/current/public;
        try_files $uri =404;
        gzip_static on;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_cache off;
    }
}
